server:
  port: 8081

spring:
  application:
    name: Identity-Microservice

#  profiles:
#    active: local

#management:
#  endpoints:
#    web:
#      exposure:
#        include: health, info
#
#  endpoint:
#    health:
#      show-details: always

  datasource:
    url: jdbc:h2:mem:IdentityDB
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

